apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankassist-backend
  namespace: bankassist-ai
  labels:
    app.kubernetes.io/name: bankassist-backend
    app.kubernetes.io/part-of: bankassist-ai
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bankassist-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bankassist-backend
    spec:
      containers:
        - name: backend
          # Replace with your Amazon ECR repository image URI (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/bankassist-ai:latest)
          image: bankassist-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: bankassist-config
            - secretRef:
                name: bankassist-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "3Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
