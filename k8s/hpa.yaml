apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bankassist-backend-hpa
  namespace: bankassist-ai
  labels:
    app.kubernetes.io/name: bankassist-backend
    app.kubernetes.io/part-of: bankassist-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bankassist-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
