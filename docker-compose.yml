version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: bankassist_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: bankassist
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ChromaDB Vector Database Container
  chromadb:
    image: chromadb/chroma:latest
    container_name: bankassist_chromadb
    restart: always
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPI Application Service (Backend & Integrated ChatBot UI)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bankassist_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-qwen/qwen3.6-27b}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=bankassist
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root
      - CHROMA_SERVER_HOST=chromadb
      - CHROMA_SERVER_PORT=8000
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-bankassist_super_secret_jwt_key_enterprise_rag_2026}
      - JWT_ALGORITHM=HS256
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - RETRIEVAL_THRESHOLD=0.15
      - CHUNK_SIZE=1000
      - CHUNK_OVERLAP=200
      - TOP_K=4
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      chromadb:
        condition: service_healthy

volumes:
  mysql_data:
  chroma_data:
