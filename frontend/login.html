<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — BankAssist AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <script>
    const savedTheme = localStorage.getItem('bankassist_theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3" style="background-color: var(--bg-main);">
  <!-- Top Right Theme Switcher -->
  <div class="position-absolute top-0 end-0 p-3">
    <button class="theme-toggle-btn fs-5 p-2 rounded-circle" onclick="toggleTheme()" title="Switch Light/Dark Theme">
      <i id="theme-icon" class="bi bi-sun"></i>
    </button>
  </div>

  <div class="p-4 p-md-5 rounded-4 shadow-lg w-100" style="max-width: 440px; background: var(--bg-card); border: 1px solid var(--border-color);">
    <!-- Brand Header -->
    <div class="text-center mb-4">
      <div class="brand-icon mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.3rem;">
        <i class="bi bi-bank2"></i>
      </div>
      <h4 class="fw-bold mb-1" style="font-family: 'Outfit', sans-serif; color: var(--text-heading);">BankAssist<span class="text-warning">.AI</span></h4>
      <p class="text-muted small">Banking Knowledge Assistant</p>
    </div>

    <!-- Error Alert -->
    <div id="login-alert" class="alert alert-danger d-none small py-2 px-3 mb-3"></div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="mb-3">
        <label class="form-label text-muted small fw-semibold">EMAIL</label>
        <input type="email" id="email" class="form-control border-secondary border-opacity-50" style="background: var(--bg-input); color: var(--text-main);" placeholder="loan.officer@bankassist.ai" value="loan.officer@bankassist.ai" required>
      </div>

      <div class="mb-4">
        <label class="form-label text-muted small fw-semibold">PASSWORD</label>
        <input type="password" id="password" class="form-control border-secondary border-opacity-50" style="background: var(--bg-input); color: var(--text-main);" placeholder="••••••••" value="Loan@123456" required>
      </div>

      <button type="submit" id="login-btn" class="btn btn-warning w-100 py-2 fw-semibold text-dark mb-4">
        Sign In to Portal
      </button>
    </form>

    <!-- Quick Demo Accounts -->
    <div class="pt-3 border-top border-secondary border-opacity-25 text-center">
      <div class="text-muted small mb-2" style="font-size: 0.75rem;">One-Click Demo Logins:</div>
      <div class="d-flex flex-wrap gap-1 justify-content-center">
        <button class="btn btn-sm btn-outline-secondary py-1 px-2 small" onclick="fillCreds('loan.officer@bankassist.ai', 'Loan@123456')">Loan Officer</button>
        <button class="btn btn-sm btn-outline-secondary py-1 px-2 small" onclick="fillCreds('compliance@bankassist.ai', 'Compliance@123456')">Compliance</button>
        <button class="btn btn-sm btn-outline-secondary py-1 px-2 small" onclick="fillCreds('support@bankassist.ai', 'Support@123456')">Support</button>
        <button class="btn btn-sm btn-outline-secondary py-1 px-2 small" onclick="fillCreds('manager@bankassist.ai', 'Manager@123456')">Manager</button>
        <button class="btn btn-sm btn-outline-secondary py-1 px-2 small" onclick="fillCreds('admin@bankassist.ai', 'Admin@123456')">Admin</button>
      </div>
    </div>
  </div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/auth.js"></script>
  <script>
    function updateThemeIcon(theme) {
      const icon = document.getElementById('theme-icon');
      if (icon) {
        icon.className = theme === 'light' ? 'bi bi-moon-fill' : 'bi bi-sun';
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('bankassist_theme', next);
      updateThemeIcon(next);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const initialTheme = localStorage.getItem('bankassist_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', initialTheme);
      updateThemeIcon(initialTheme);
    });

    function fillCreds(e, p) {
      document.getElementById('email').value = e;
      document.getElementById('password').value = p;
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('login-alert');
      const submitBtn = document.getElementById('login-btn');

      alertBox.classList.add('d-none');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';

      try {
        const tokenRes = await BankAPI.login(email, password);
        BankAPI.setAuthToken(tokenRes.access_token);
        BankAPI.setUserData(tokenRes.user);
        window.location.href = '/dashboard';
      } catch (err) {
        alertBox.innerText = err.message || 'Login failed.';
        alertBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In to Portal';
      }
    });
  </script>
</body>
</html>
